name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    # A Windows Service, so it is built and tested on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx"
      - run: dotnet publish src/TaxiReceipt.Service -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: TaxiReceipt.Service-win-x64
          path: publish
